<div class="modal-header">
    <h4 *ngIf="!propUnitType.id" class="modal-title">{{ 'PROP-UNIT-TYPES-MODAL.CREATE.TITLE' | translate }}</h4>
    <h4 *ngIf="propUnitType.id" class="modal-title">{{ 'PROP-UNIT-TYPES-MODAL.UPDATE.TITLE' | translate }}</h4>
    <button type="button" class="close" aria-label="Close" (click)="closeModal()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group">
                <label for="name">{{ 'PROP-UNIT-TYPES-MODAL.NAME-FIELD.TITLE' | translate }}</label>
                <input class="form-control" id="name" [(ngModel)]="propUnitType.name" type="text"
                       placeholder="{{ 'PROP-UNIT-TYPES-MODAL.NAME-FIELD.PLACEHOLDER' | translate }}">
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group">
                <label for="abbrv">{{ 'PROP-UNIT-TYPES-MODAL.ABBRV-FIELD.TITLE' | translate }}</label>
                <input class="form-control" id="abbrv" [(ngModel)]="propUnitType.abbrv" type="text"
                       placeholder="{{ 'PROP-UNIT-TYPES-MODAL.ABBRV-FIELD.PLACEHOLDER' | translate }}">
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group">
                <label for="state">{{ 'PROP-UNIT-TYPES-MODAL.SELECT-STATE.TITLE' | translate }}</label>
                <ng-select id ="state"
                           [items]="propUnitTypeStates"
                           placeholder="{{ 'PROP-UNIT-TYPES-MODAL.SELECT-STATE.PLACEHOLDER' | translate }}"
                           bindLabel="name"
                           bindValue="id"
                           [(ngModel)]="propUnitType.state">
                </ng-select>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-success" (click)="saveData()" [disabled]="!(propUnitType.name && propUnitType.state &&
     propUnitType.abbrv )">{{ 'PROP-UNIT-TYPES-MODAL.BUTTON' | translate }}</button>
</div>
