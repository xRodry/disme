<div class="app-body">
  <main class="main d-flex align-items-center">
    <div class="container">
      <div class="row">
        <div class="col-md-6 mx-auto">
          <div class="card mx-4">
            <div class="card-body p-4">
                <h1>Register</h1>
                <p class="text-muted">Create your account</p>

                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="icon-user"></i></span>
                  </div>
                  <input type="text" class="form-control" id="name" [(ngModel)]="user.name" placeholder="Name" autocomplete="name" required>
                </div>


                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="icon-user"></i></span>
                  </div>
                  <input type="text" class="form-control" id="user_name" [(ngModel)]="user.user_name" placeholder="Username" autocomplete="username" required>
                </div>



                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <span class="input-group-text">@</span>
                  </div>
                  <input type="text" class="form-control" id="email" [(ngModel)]="user.email" placeholder="Email" autocomplete="email" required>
                </div>
                <div class="input-group mb-3">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="icon-lock"></i></span>
                  </div>
                  <input type="password" class="form-control" id="password" [(ngModel)]="user.password" placeholder="Password" autocomplete="new-password" required>
                </div>
                <div class="input-group mb-4">
                  <div class="input-group-prepend">
                    <span class="input-group-text"><i class="icon-lock"></i></span>
                  </div>
                  <input type="password" class="form-control" id="password_confirmation" [(ngModel)]="user.password_confirmation"  placeholder="Repeat password" autocomplete="new-password" required>
                </div>
                <button type="button" class="btn btn-block btn-success" (click)="saveData()">Create Account</button>
                <button type="button" class="btn btn-block btn-primary" (click)="goToLogin()">Go back</button>
            </div>
            <div class="card-footer p-4">
<!--              <div class="row">-->
<!--                <div class="col-6">-->
<!--                  <button class="btn btn-block btn-facebook" type="button"><span>facebook</span></button>-->
<!--                </div>-->
<!--                <div class="col-6">-->
<!--                  <button class="btn btn-block btn-twitter" type="button"><span>twitter</span></button>-->
<!--                </div>-->
<!--              </div>-->
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
