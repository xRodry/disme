<div class="card">
  <div class="card-body">
    <form-builder *ngIf="showFormEditor" [hidden]="hiddenForm" [form]="myForm" [options]="options" (change)="onChange($event)"></form-builder>
  </div>
  <div class="card-footer text-muted text-center">
    <button type="button" class="btn btn-success" (click)="saveForm()"> {{ formId ? ('FORMIO.UPDATE-BUTTON' | translate) : ('FORMIO.SAVE-BUTTON' | translate) }} </button>
  </div>
</div>
