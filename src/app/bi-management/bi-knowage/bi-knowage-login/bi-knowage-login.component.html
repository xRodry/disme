<section class="vh-100">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card shadow-2-strong" style="border-radius: 1rem;">
                    <div class="card-body p-5 text-center">
                        <h3 class="mb-5">{{ 'BI-MANAGEMENT.BI-KNOWAGE.LOGIN.TITLE' | translate }}</h3>

                        <div class="form-outline mb-4">
                            <input type="text" [(ngModel)]="username" id="typeEmailX-2" class="form-control form-control-lg" />
                            <label class="form-label" for="typeEmailX-2">{{ 'BI-MANAGEMENT.BI-KNOWAGE.LOGIN.USERNAME' | translate }}</label>
                        </div>

                        <div class="form-outline mb-4">
                            <input type="password" [(ngModel)]="password" id="typePasswordX-2" class="form-control form-control-lg" />
                            <label class="form-label" for="typePasswordX-2">{{ 'BI-MANAGEMENT.BI-KNOWAGE.LOGIN.PASSWORD' | translate }}</label>
                        </div>

                        <button (click)="saveDataLocal()" routerLink="/biManagement/BiKnowageManagement" class="btn btn-primary btn-lg btn-block" type="submit">
                            {{ 'BI-MANAGEMENT.BI-KNOWAGE.LOGIN.BUTTON' | translate }}
                        </button>
                        <hr class="my-4">
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
