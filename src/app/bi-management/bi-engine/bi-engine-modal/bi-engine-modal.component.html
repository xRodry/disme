<div class="modal-header">
    <h4 class="modal-title">{{ 'BI-MANAGEMENT.BI-ENGINE.MODAL.TITLE' | translate }}</h4>
    <button type="button" class="close" aria-label="Close" (click)="closeModal()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group">
                <label for="name">{{ 'BI-MANAGEMENT.BI-ENGINE.MODAL.NAME' | translate }}</label>
                <input class="form-control" id="name" [(ngModel)]="biEngine.name" type="text" placeholder="{{ 'BI-MANAGEMENT.BI-ENGINE.MODAL.NAME-PLACEHOLDER' | translate }}">
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group">
                <form>
                    <div class="form-group">
                        <fieldset class="form-group">
                            <label>{{ 'BI-MANAGEMENT.BI-ENGINE.MODAL.PREVIEW-IMAGE' | translate }}</label>
                            {{imageError}}
                            <div class="custom-file fileInputProfileWrap">
                                <input type="file" (change)="fileChangeEvent($event)" class="fileInputProfile">
                                <div class="img-space">
                                    <ng-container *ngIf="biEngine.logo_preview?.length && !isImageSaved;">
                                        <img [src]="biEngine.logo_preview" />
                                    </ng-container>
                                    <ng-container *ngIf="!biEngine.logo_preview?.length || isImageSaved; then thenTemplate2;">
                                    </ng-container>
                                    <ng-container *ngIf="!biEngine.logo_preview?.length && !isImageSaved; then elseTemplate;">
                                    </ng-container>
                                    <ng-template #thenTemplate2>
                                        <img [src]="cardImageBase64" />
                                    </ng-template>
                                    <ng-template #elseTemplate>
                                        <img src="../../../../assets/img/no_image_item.png" class="img-responsive">
                                    </ng-template>
                                </div>
                            </div>
                        </fieldset>
                    </div>
                    <a class="btn btn-danger" (click)="removeImage()" *ngIf="isImageSaved">{{ 'BI-MANAGEMENT.BI-ENGINE.MODAL.REMOVE-IMAGE' | translate }}</a>
                </form>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-success" [disabled]="cantSaveEngine()" (click)="saveData()">{{ 'BI-MANAGEMENT.BI-ENGINE.MODAL.SAVE' | translate }}</button>
</div>
