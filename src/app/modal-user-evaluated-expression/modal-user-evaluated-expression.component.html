<div class="modal-header">
    <h4 class="modal-title">{{'MODAL-USER-EVALUATED-EXPRESSION.TITLE'  | translate }}</h4>
    <button type="button" class="close" aria-label="Close" (click)="closeModal()">
        <span aria-hidden="true">X</span>
    </button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group">
                <span [innerHTML]="userEvaluatedExpressionText"></span>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-success" (click)="passBack('true')">{{'MODAL-USER-EVALUATED-EXPRESSION.YES-BUTTON' | translate }}</button>
    <button type="button" class="btn btn-danger" (click)="passBack('false')">{{'MODAL-USER-EVALUATED-EXPRESSION.NO-BUTTON' | translate }}</button>
</div>
