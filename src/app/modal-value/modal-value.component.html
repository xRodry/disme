<div class="modal-header">
    <h4 class="modal-title">{{ 'VALUE-MODAL.UPDATE.TITLE' | translate }}</h4>
    <button type="button" class="close" aria-label="Close" (click)="closeModal()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group">
                <label for="name">{{ 'VALUE-MODAL.VALUE-FIELD.TITLE' | translate }}</label>
                <input class="form-control" id="name" [(ngModel)]="value.value" type="text"
                       placeholder="{{ 'VALUE-MODAL.VALUE-FIELD.PLACEHOLDER' | translate }}">
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-sm-12">
            <div class="form-group">
                <label for="state">{{ 'VALUE-MODAL.SELECT-STATE.TITLE' | translate }}</label>
                <ng-select id ="state"
                           [items]="valueStates"
                           placeholder="{{ 'VALUE-MODAL.SELECT-STATE.PLACEHOLDER' | translate }}"
                           bindLabel="name"
                           bindValue="id"
                           [(ngModel)]="value.state">
                </ng-select>
            </div>
        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-success" (click)="saveData()" [disabled]="!(value.value && value.state)">
        {{ 'VALUE-MODAL.BUTTON' | translate }}</button>
</div>
